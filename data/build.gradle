apply from: "../default_core_module.gradle"

android {
    namespace 'uddug.com.data'
}

dependencies {

    implementation data.retrofit
    implementation data.retrofitRxJava
    implementation(data.gsonConverter) {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly data.gson
    implementation data.retrofitLogging
    implementation ui.gmsPlayServicesLocation

    implementation lib.domain


    implementation "com.google.dagger:hilt-android:2.55"
    kapt "com.google.dagger:hilt-android-compiler:2.55"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.hilt:hilt-navigation-fragment:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.5.0"

    // Room. NB: the room-compiler shipped with 2.6.1 jarjars a kotlinx-metadata
    // reader that only understands Kotlin metadata <= 2.0.0 and hard-fails under
    // kapt on this project's Kotlin 2.1.10 (@Metadata version 2.1.0). Room 2.7.x
    // is the first line whose compiler reads 2.1.x metadata, so we build against
    // it while keeping the plain kapt setup used everywhere else in the module.
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    kapt "androidx.room:room-compiler:2.7.1"


}
